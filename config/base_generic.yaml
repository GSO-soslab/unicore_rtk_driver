# Base station configured with its own tools (e.g. SparkFun RTK Surveyor in
# base mode, RTCM enabled on the port connected to this computer).  The driver
# only forwards the RTCM it outputs and parses its NMEA.
/**:
  ros__parameters:
    device: /dev/ttyACM0
    baudrate: 115200
    gps_frame_id: rtk_base

    mode: base
    receiver: generic

    rtcm:
      outputs: ['tcpserver://0.0.0.0:2101', 'udp://192.168.1.255:2101']
